<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>内容工厂采集助手</title>
    <style>
      * { box-sizing: border-box; }
      body { width: 380px; max-height: 600px; margin: 0; overflow-y: auto; padding: 16px; color: #17211d; background: #f5f6f3; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      h1, h2, p { margin: 0; }
      h1 { font-size: 17px; }
      h2 { margin-bottom: 10px; font-size: 14px; }
      .subtitle { margin-top: 5px; color: #66706b; font-size: 12px; line-height: 1.6; }
      .card { margin-top: 12px; padding: 12px; border: 1px solid #dfe4e1; border-radius: 12px; background: #fff; }
      details summary { cursor: pointer; color: #315f4d; font-size: 12px; font-weight: 700; }
      label { display: grid; gap: 5px; margin-top: 9px; color: #47534d; font-size: 12px; font-weight: 650; }
      input, textarea { width: 100%; border: 1px solid #ccd4d0; border-radius: 8px; padding: 8px 9px; color: #17211d; background: #fff; font: inherit; font-size: 12px; font-weight: 400; }
      textarea { min-height: 58px; resize: vertical; line-height: 1.5; }
      button { width: 100%; margin-top: 10px; border: 0; border-radius: 9px; padding: 10px 12px; color: #fff; background: #173e32; font: inherit; font-size: 13px; font-weight: 750; cursor: pointer; }
      button.secondary { border: 1px solid #b9c8c1; color: #315f4d; background: #fff; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      .meta { margin-top: 8px; color: #6a746f; font-size: 11px; line-height: 1.5; word-break: break-all; }
      .metric-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin-top: 10px; }
      .metric-grid div { display: grid; gap: 2px; padding: 7px 8px; border-radius: 7px; background: #f4f7f5; }
      .metric-grid span { color: #66706b; font-size: 10px; }
      .metric-grid strong { color: #26352f; font-size: 12px; }
      .metric-grid .missing strong { color: #8a938f; font-size: 10px; font-weight: 500; }
      .content-list { display: grid; gap: 6px; margin: 9px 0 0; padding: 0; list-style: none; }
      .content-list li { padding: 7px 8px; border-radius: 7px; color: #4d5853; background: #f4f7f5; font-size: 11px; line-height: 1.45; }
      .mode-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
      .mode-grid div { padding: 9px 10px; border: 1px solid #dfe4e1; border-radius: 10px; background: #fff; }
      .mode-grid strong { display: block; font-size: 12px; }
      .mode-grid span { display: block; margin-top: 3px; color: #748079; font-size: 10px; line-height: 1.4; }
      .summary { margin-top: 9px; padding: 8px 9px; border-radius: 8px; color: #47534d; background: #f4f7f5; font-size: 11px; line-height: 1.55; white-space: pre-wrap; }
      .image-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 9px; }
      .image-grid img { width: 100%; aspect-ratio: 3 / 4; border-radius: 7px; object-fit: cover; background: #eef1ef; }
      .inline-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .keyword-list { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
      .keyword-list button { width: auto; margin: 0; border: 1px solid #c7d5ce; padding: 7px 9px; color: #23483b; background: #f7faf8; font-size: 11px; font-weight: 650; }
      .search-result-list { display: grid; gap: 8px; margin-top: 10px; }
      .search-result { display: grid; grid-template-columns: 54px 1fr; gap: 9px; padding: 8px; border: 1px solid #e1e6e3; border-radius: 9px; background: #fff; }
      .search-result img { width: 54px; height: 72px; border-radius: 6px; object-fit: cover; background: #eef1ef; }
      .search-result strong { display: block; font-size: 11px; line-height: 1.45; }
      .search-result span { display: block; margin-top: 4px; color: #68736d; font-size: 10px; line-height: 1.4; }
      .search-result a { display: inline-block; margin-top: 5px; color: #176b50; font-size: 10px; font-weight: 700; }
      select { width: 100%; border: 1px solid #ccd4d0; border-radius: 8px; padding: 8px 9px; color: #17211d; background: #fff; font: inherit; font-size: 12px; }
      #status { margin-top: 12px; padding: 9px 10px; border-radius: 8px; color: #52605a; background: #e9efec; font-size: 12px; line-height: 1.55; white-space: pre-wrap; }
      #status.error { color: #991b1b; background: #fef2f2; }
      #status.success { color: #166534; background: #ecfdf5; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>内容工厂采集助手</h1>
    <p class="subtitle">只读取当前页面已经可见的信息，不绕过登录、验证码或平台权限。</p>

    <div class="mode-grid">
      <div><strong>账号采集</strong><span>在“我”的主页更新账号定位</span></div>
      <div><strong>爆款采集</strong><span>在笔记详情页预览并保存</span></div>
      <div><strong>爆款搜索</strong><span>基于定位找长尾词并筛选结果</span></div>
    </div>

    <details class="card">
      <summary>连接设置</summary>
      <label>
        内容工厂地址
        <input id="baseUrl" type="url" placeholder="https://content.example.com" />
      </label>
      <label>
        访问码（远程部署可选）
        <input id="accessToken" type="password" autocomplete="off" />
      </label>
      <button class="secondary" id="saveSettings" type="button">保存并授权该地址</button>
    </details>

    <section class="card">
      <h2>本地资料库</h2>
      <p class="meta" id="localArchiveStatus">正在检查本地目录…</p>
      <button class="secondary" id="chooseLocalArchive" type="button">选择本地资料库文件夹</button>
    </section>

    <button id="capture" type="button">识别并采集当前页面</button>

    <section class="card" id="searchWorkbench" hidden>
      <h2>爆款搜索工作台</h2>
      <p class="meta">关键词来自已确认账号定位。点击关键词会打开小红书搜索；滚动加载结果后，再回插件采集当前页面。</p>
      <button class="secondary" id="recommendKeywords" type="button">根据当前定位推荐长尾词</button>
      <div class="keyword-list" id="keywordList"></div>
      <div class="inline-grid">
        <label>
          时间范围
          <select id="searchDays">
            <option value="3">近 3 天</option>
            <option value="7" selected>近 7 天</option>
            <option value="0">不限时间</option>
          </select>
        </label>
        <label>最低点赞<input id="minimumLikes" inputmode="numeric" type="number" min="0" value="100" /></label>
      </div>
      <div class="inline-grid">
        <label>
          排序
          <select id="searchSort">
            <option value="likes_desc">点赞从高到低</option>
            <option value="published_desc">最新发布</option>
          </select>
        </label>
        <label style="display:flex;align-items:flex-end;grid-template-columns:auto 1fr;padding-bottom:8px">
          <input id="includeUnknownDates" type="checkbox" style="width:auto" />
          保留时间未知
        </label>
      </div>
      <button id="captureSearchResults" type="button">采集并筛选当前搜索结果</button>
      <p class="summary" id="searchSummary" hidden></p>
      <div class="search-result-list" id="searchResultList"></div>
      <button class="secondary" id="saveSearchLocal" type="button" hidden>保存搜索清单到本地知识库</button>
    </section>

    <section class="card" id="capturePreview" hidden>
      <h2>1. 确认采集信息</h2>
      <label>账号名称<input id="accountName" /></label>
      <label>账号简介<textarea id="bio"></textarea></label>
      <label>可见粉丝数<input id="followerCount" /></label>
      <p class="meta" id="captureMeta"></p>
      <div class="metric-grid" id="captureMetrics"></div>
      <ul class="content-list" id="contentList"></ul>
      <button class="secondary" id="saveLocal" type="button">保存账号到本地资料库</button>
      <button id="analyze" type="button">确认采集并生成 AI 定位预览</button>
    </section>

    <section class="card" id="inspirationPreview" hidden>
      <h2>确认小红书笔记</h2>
      <p class="summary" id="inspirationSource"></p>
      <label>标题<input id="inspirationTitle" /></label>
      <label>正文<textarea id="inspirationContent" style="min-height:120px"></textarea></label>
      <label>标签（用逗号分隔）<input id="inspirationTags" /></label>
      <div class="metric-grid" id="inspirationMetrics"></div>
      <div class="image-grid" id="inspirationImages"></div>
      <p class="meta" id="inspirationMedia"></p>
      <label>
        保存到
        <select id="saveDestination">
          <option value="both">网站爆款库 + 本地知识库</option>
          <option value="local">仅本地知识库</option>
          <option value="website">仅网站爆款库</option>
        </select>
      </label>
      <label>来源关键词（可选）<input id="inspirationKeyword" placeholder="例如：AI 企业落地" /></label>
      <label>内容方向（可选）<input id="inspirationDirection" placeholder="例如：企业 AI 试点方法" /></label>
      <button id="saveInspiration" type="button">保存笔记</button>
      <button class="secondary" id="openInspiration" type="button" hidden>打开网站爆款详情</button>
    </section>

    <section class="card" id="draftPreview" hidden>
      <h2>2. 确认 AI 定位</h2>
      <label>业务类型<textarea id="draftBusiness"></textarea></label>
      <label>核心产品 / 服务<textarea id="draftOffer"></textarea></label>
      <label>账号定位<textarea id="draftPosition"></textarea></label>
      <label>目标客户（每行一项）<textarea id="draftAudience"></textarea></label>
      <label>内容支柱（每行一项）<textarea id="draftPillars"></textarea></label>
      <label>品牌语气（每行一项）<textarea id="draftVoice"></textarea></label>
      <label>下一阶段内容方向（每行一项）<textarea id="draftDirections"></textarea></label>
      <label>推荐选题（每行一项）<textarea id="draftTopics"></textarea></label>
      <button id="confirm" type="button">确认并覆盖当前账号</button>
    </section>

    <div id="status">请打开小红书账号主页或一篇笔记详情，再主动点击采集。</div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
