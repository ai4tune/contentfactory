services:
  contentfactory:
    build:
      context: .
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      CONTENT_FACTORY_DATA_DIR: /app/data
      CONTENT_FACTORY_BACKUP_DIR: /app/backups
    ports:
      - "${CONTENT_FACTORY_PORT:-3000}:3000"
    restart: unless-stopped
    volumes:
      - contentfactory-data:/app/data
      - contentfactory-backups:/app/backups
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  contentfactory-data:
  contentfactory-backups:
